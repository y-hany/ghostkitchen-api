<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GhostKitchen & Supper Club Cairo — Commercial Kitchens & Pop-up Dining</title>
  
  <meta name="description" content="Cairo's curated network connecting licensed commercial kitchens with guest chefs, culinary creators, and exclusive pop-up supper clubs.">
  <meta name="keywords" content="Cairo ghost kitchens, Cairo supper clubs, pop-up dinner Cairo, commercial kitchen rental, culinary space Zamalek Maadi Dokki">
  
  <!-- OpenGraph Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GhostKitchen & Supper Club Cairo">
  <meta property="og:description" content="Discover secret Cairo supper clubs or rent licensed commercial kitchens by the hour during off-peak shifts.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:url" content="https://ghostkitchen-api.vercel.app">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GhostKitchen & Supper Club Cairo">
  <meta name="twitter:description" content="Discover secret Cairo supper clubs or rent licensed commercial kitchens by the hour.">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b84324' stroke-width='2.2'%3E%3Cpath d='M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0'/%3E%3Cpath d='M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2'/%3E%3Cpath d='M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8'/%3E%3Cpath d='M18 8a6 6 0 1 1-12 0'/%3E%3Cpath d='M12 18v4'/%3E%3Cpath d='M8 22h8'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Bar (Dynamically updated via RBAC) -->
  <nav id="topNav">
    <a class="brand" href="#events">
      <svg class="ico-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
        <path d="M18 8a6 6 0 1 1-12 0"/>
        <path d="M12 18v4"/>
        <path d="M8 22h8"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">GhostKitchen</span>
        <span class="brand-sub">Pop-ups & Supper Clubs</span>
      </div>
    </a>
    
    <!-- Dynamic RBAC Navigation Links -->
    <div class="links" id="navLinks"></div>

    <!-- Actions: Theme Toggle & Role Badge / Auth Action -->
    <div class="nav-actions">
      <button type="button" class="theme-btn" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle theme">
        <svg class="theme-ico sun-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <div id="navUserAction"></div>
    </div>
  </nav>

  <!-- Single Container for Dynamic Views (No hidden Admin/Host code in DOM!) -->
  <main id="appView">
    <div class="hero">
      <h1>Cairo Pop-ups & Commercial Kitchens</h1>
      <p>Discover intimate supper clubs or rent licensed commercial kitchen shifts across Zamalek, Maadi, Dokki, and New Cairo.</p>
    </div>
    <div class="card skeleton-card">
      <div class="skeleton skeleton-img"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line sm"></div>
    </div>
  </main>

  <!-- Modal Container for Clean Creation Flows -->
  <div id="modalContainer" hidden></div>

  <!-- Reviewer & Staging Drawer (Discreet floating corner pill) -->
  <aside id="demoDrawer" class="demo-drawer minimized">
    <button type="button" class="demo-drawer-pill" id="demoToggle" aria-label="Toggle demo tester persona">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Tester Mode</span>
      <span class="demo-arrow">▲</span>
    </button>
    <div class="demo-drawer-roles">
      <button type="button" class="demo-role-btn" data-act="demo" data-role="attendee" title="Experience app as Dinner Guest">Diner</button>
      <button type="button" class="demo-role-btn" data-act="demo" data-role="chef" title="Experience app as Guest Chef">Chef</button>
      <button type="button" class="demo-role-btn" data-act="demo" data-role="host" title="Experience app as Commercial Kitchen Host">Host</button>
      <button type="button" class="demo-role-btn" data-act="demo" data-role="admin" title="Experience app as Platform Administrator">Admin</button>
      <button type="button" class="demo-close-btn" data-act="close-demo" title="Minimize tester pill">✕</button>
    </div>
  </aside>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
