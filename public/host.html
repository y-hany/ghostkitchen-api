<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Host Dashboard · GhostKitchen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav><a class="brand" href="kitchens.html">🍳 GhostKitchen</a><div class="links"><a href="login.html"><i>👤</i><span>Profile</span></a><a href="kitchens.html"><i>🏪</i><span>Kitchens</span></a><a href="host.html" data-roles="host"><i>📋</i><span>Host</span></a><a href="chef.html" data-roles="chef"><i>🧑‍🍳</i><span>Chef</span></a><a href="event.html"><i>🍽️</i><span>Events</span></a><a href="tickets.html" data-roles="guest attendee chef"><i>🎟️</i><span>Tickets</span></a><a href="admin.html" data-roles="admin"><i>🛡️</i><span>Admin</span></a></div><a class="role-chip" href="login.html" id="roleChip">Guest</a></nav>
<main data-page="host" data-roles="host"><h1>Host dashboard</h1><p class="sub" id="hostSub"></p><div id="hostStats"></div><h2>Booking requests</h2><div id="hostBookings"></div>
<h2>Add kitchen</h2><form class="card" novalidate data-form="kitchen"><label>name</label><input name="name" type="text" value="" placeholder="e.g. Garden City Culinary Studio"><label>address</label><input name="address" type="text" value="" ><div class="grid2"><div><label>license_info</label><input name="license_info" type="text" value="" ></div><div><label>hourly_rate (EGP)</label><input name="hourly_rate" type="number" value="" inputmode="numeric" min="1"></div></div><label>equipment (optional, comma separated)</label><input name="equip" type="text" value="" placeholder="Walk-in fridge, Gas range"><div class="msg err" role="alert" hidden></div><button type="submit">Submit for license review</button></form>
<h2>Add availability slot</h2><form class="card" novalidate data-form="slot"><label>kitchen_id</label><select name="kitchen_id" id="slotKitchen"></select><div class="grid2"><div><label>start_time</label><input name="start_time" type="datetime-local" value="" ></div><div><label>end_time</label><input name="end_time" type="datetime-local" value="" ></div></div><label>status</label><select name="status"><option>open</option><option>booked</option></select><div class="msg err" role="alert" hidden></div><button type="submit">Add slot</button></form></main><script src="app.js"></script></body></html>
